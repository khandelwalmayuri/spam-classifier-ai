<!DOCTYPE html>
<html>
<head>
    <title>Spam Classifier</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        textarea {
            width: 300px;
            height: 100px;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
        }
        h2 {
            color: green;
        }
    </style>
</head>
<body>

    <h1>📧 Spam Message Classifier</h1>

    <form method="POST">
        <textarea name="message" placeholder="Enter your message here..." required></textarea><br>
        <button type="submit">Check</button>
    </form>

    {% if result %}
        <h2>Result: {{ result }}</h2>
    {% endif %}

</body>
</html>
